<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz visuel ISOM 2017-2</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;color:#202124}
.wrap{max-width:920px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 4px 18px #0001}
h1{margin:0 0 8px;font-size:28px}
h2{font-size:22px;margin:12px 0 18px}
.progress{font-weight:bold;margin-bottom:12px;color:#555}
.symbol{display:flex;justify-content:center;align-items:center;min-height:230px;margin:8px 0 22px;background:#fff;border-radius:14px}
.symbol img{max-width:95%;max-height:220px;image-rendering:auto}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.opt{padding:17px;border:2px solid #ddd;border-radius:12px;background:#fff;font-size:17px;cursor:pointer;text-align:left}
button.opt:hover{background:#f0f4ff;border-color:#9ab}
button.opt:disabled{cursor:default}
.feedback{margin-top:18px;padding:15px;border-radius:12px;display:none;font-size:18px}
.correct{background:#e9f7ee;border:1px solid #9bd3aa}
.wrong{background:#fff0f0;border:1px solid #e0a0a0}
.next{margin-top:18px;padding:13px 20px;border:0;border-radius:10px;font-size:17px;cursor:pointer;display:none;background:#222;color:#fff}
.score{font-size:25px;font-weight:bold}
.small{color:#666}
@media(max-width:650px){.wrap{padding:12px}.card{padding:18px}.options{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Quiz visuel — ISOM 2017-2</h1>
<p class="small">27 questions · 4 réponses possibles · une seule bonne réponse</p>
<div id="app"></div>
</div></div>
<script>
const cards = [{"num": 1, "correct": "Courbe de niveau", "options": ["Colline", "Courbe de niveau maîtresse et cote d'altitude", "Dépressions", "Courbe de niveau"], "image": "q01.png"}, {"num": 2, "correct": "Courbe de niveau maîtresse et cote d'altitude", "options": ["Dépressions", "Colline", "Courbe de niveau maîtresse et cote d'altitude", "Courbe de niveau"], "image": "q02.png"}, {"num": 3, "correct": "Colline", "options": ["Petites buttes", "Courbe de niveau", "Dépressions", "Colline"], "image": "q03.png"}, {"num": 4, "correct": "Petites buttes", "options": ["Colline", "Dépressions", "Petites buttes", "Trou"], "image": "q04.png"}, {"num": 5, "correct": "Dépressions", "options": ["Petites buttes", "Colline", "Trou", "Dépressions"], "image": "q05.png"}, {"num": 6, "correct": "Trou", "options": ["Petite dépression", "Petites buttes", "Dépressions", "Trou"], "image": "q06.png"}, {"num": 7, "correct": "Ravine", "options": ["Falaise", "Tranchée", "Ravine", "Dépressions"], "image": "q07.png"}, {"num": 8, "correct": "Terrain découvert", "options": ["Terrain découvert avec arbres dispersés", "Terrain cultivé", "Terrain découvert", "Végétation, course lente"], "image": "q08.png"}, {"num": 9, "correct": "Terrain découvert avec arbres dispersés", "options": ["Terrain découvert avec arbres dispersés", "Terrain cultivé", "Terrain découvert", "Végétation, course lente"], "image": "q09.png"}, {"num": 10, "correct": "Végétation, course lente", "options": ["Terrain découvert avec arbres dispersés", "Terrain cultivé", "Végétation, course lente", "Terrain découvert"], "image": "q10.png"}, {"num": 11, "correct": "Terrain cultivé", "options": ["Terrain découvert avec arbres dispersés", "Terrain découvert", "Végétation, course lente", "Terrain cultivé"], "image": "q11.png"}, {"num": 12, "correct": "Falaise", "options": ["Zone de blocs rocheux", "Tranchée", "Bloc rocheux", "Falaise"], "image": "q12.png"}, {"num": 13, "correct": "Bloc rocheux", "options": ["Tranchée", "Zone de blocs rocheux", "Bloc rocheux", "Falaise"], "image": "q13.png"}, {"num": 14, "correct": "Zone de blocs rocheux", "options": ["Falaise", "Tranchée", "Bloc rocheux", "Zone de blocs rocheux"], "image": "q14.png"}, {"num": 15, "correct": "Tranchée", "options": ["Tranchée", "Ravine", "Bloc rocheux", "Falaise"], "image": "q15.png"}, {"num": 16, "correct": "Étendue d’eau infranchissable", "options": ["Marais étroit", "Étendue d’eau infranchissable", "Marais", "Cours d’eau franchissable"], "image": "q16.png"}, {"num": 17, "correct": "Cours d’eau franchissable", "options": ["Étendue d’eau infranchissable", "Marais étroit", "Marais", "Cours d’eau franchissable"], "image": "q17.png"}, {"num": 18, "correct": "Marais", "options": ["Marais étroit", "Étendue d’eau infranchissable", "Marais", "Cours d’eau franchissable"], "image": "q18.png"}, {"num": 19, "correct": "Marais étroit", "options": ["Étendue d’eau infranchissable", "Cours d’eau franchissable", "Marais", "Marais étroit"], "image": "q19.png"}, {"num": 20, "correct": "Chemin", "options": ["Chemin", "Sentier", "Route", "Chemin carrossable"], "image": "q20.png"}, {"num": 21, "correct": "Sentier", "options": ["Sentier", "Sentier peu visible", "Chemin carrossable", "Chemin"], "image": "q21.png"}, {"num": 22, "correct": "Pont / tunnel", "options": ["Pont / tunnel", "Clôture", "Mur", "Passerelle / petit pont"], "image": "q22.png"}, {"num": 23, "correct": "Mur", "options": ["Clôture", "Pont / tunnel", "Mur en ruine", "Mur"], "image": "q23.png"}, {"num": 24, "correct": "Clôture", "options": ["Clôture en ruine", "Pont / tunnel", "Clôture", "Mur"], "image": "q24.png"}, {"num": 25, "correct": "Bâtiments", "options": ["Bâtiment / passage couvert", "Bâtiments", "Ruine", "Zone pavée"], "image": "q25.png"}, {"num": 26, "correct": "Ruine", "options": ["Bâtiments", "Bâtiment / passage couvert", "Ruine", "Mur en ruine"], "image": "q26.png"}, {"num": 27, "correct": "Escalier", "options": ["Ruine", "Passerelle / petit pont", "Pont / tunnel", "Escalier"], "image": "q27.png"}];
let idx=0, score=0, answered=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function render(){
  answered=false;
  const q=cards[idx];
  document.getElementById('app').innerHTML=`
    <div class="progress">Question ${q.num} / ${cards.length}</div>
    <h2>Quel élément représente ce symbole ?</h2>
    <div class="symbol"><img src="${q.image}" alt="Symbole ISOM"></div>
    <div class="options">
      ${q.options.map((o,i)=>`<button class="opt" onclick="answer(this, '${esc(o)}')">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
    </div>
    <div id="feedback" class="feedback"></div>
    <button id="next" class="next" onclick="nextQ()">Question suivante →</button>
  `;
}
function answer(btn, choice){
  if(answered) return;
  answered=true;
  const q=cards[idx];
  const ok=choice===q.correct;
  if(ok) score++;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=document.getElementById('feedback');
  fb.style.display='block';
  fb.className='feedback '+(ok?'correct':'wrong');
  fb.innerHTML=ok ? '✓ Bonne réponse !' : '✗ La bonne réponse est : <b>'+esc(q.correct)+'</b>';
  document.getElementById('next').style.display='inline-block';
}
function nextQ(){
  idx++;
  if(idx>=cards.length){
    document.getElementById('app').innerHTML=`
      <div class="score">Quiz terminé</div>
      <p>Score : <b>${score} / ${cards.length}</b></p>
      <button class="next" style="display:inline-block" onclick="idx=0;score=0;render()">Recommencer</button>
    `;
  } else render();
}
render();
</script>
</body>
</html>
